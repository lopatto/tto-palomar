name = "tto"
version = "0.1.0"
defaultTargets = ["Challenge", "Solution", "StatementChecks"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "TTO"
globs = ["TTO.+"]
moreLeanArgs = ["-j1"]

[[lean_lib]]
name = "Challenge"
moreLeanArgs = ["-j1"]

[[lean_lib]]
name = "Solution"
moreLeanArgs = ["-j1"]

[[lean_lib]]
name = "StatementChecks"
moreLeanArgs = ["-j1"]
